# Authors: John Broadway, Claude (Anthropic)
#
# Three independent jobs run on every push and pull request to main:
#   - scrub   : origin-scrub against the SCRUB_PATTERNS repo secret
#   - tests   : 162-case bash test harness (make test → tests/run.sh)
#   - verify  : programmatic project audit (make verify → scripts/maude-verify.sh)
#
# Patterns live in the SCRUB_PATTERNS repository secret (not in source).
# Security note: the SCRUB_PATTERNS secret is bound via `env:` and never
# interpolated into shell commands. This is the safe pattern; see
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Load scrub patterns from secret
        env:
          SCRUB_PATTERNS: ${{ secrets.SCRUB_PATTERNS }}
        run: |
          if [ -z "$SCRUB_PATTERNS" ]; then
            echo "::error::SCRUB_PATTERNS secret is not set on this repository."
            echo "::error::Add it under Settings to Secrets and variables to Actions."
            exit 2
          fi
          mkdir -p "$RUNNER_TEMP/scrub"
          printf '%s' "$SCRUB_PATTERNS" > "$RUNNER_TEMP/scrub/patterns.txt"
          chmod 600 "$RUNNER_TEMP/scrub/patterns.txt"
          echo "patterns loaded ($(wc -l < "$RUNNER_TEMP/scrub/patterns.txt") lines)"

      - name: Origin scrub check
        env:
          SCRUB_PATTERNS_FILE: ${{ runner.temp }}/scrub/patterns.txt
        run: bash scripts/scrub-check.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify jq present
        run: jq --version

      - name: Run hook test suite (make test)
        run: make test

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify jq present
        run: jq --version

      - name: Run project audit (make verify)
        run: make verify
