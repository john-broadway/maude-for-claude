# (De-versioned: this workflow tracks no version of its own — the canonical version
#  lives in .claude-plugin/plugin.json. This header used to pin a number that drifted.)
# Last substantive change: 2026-06-14 — added the shellcheck lint job (v0.5.5).
# Authors: John Broadway, Claude (Anthropic)
#
# Independent jobs run on every push and pull request to main:
#   - tests   : full bash test harness (make test → tests/run.sh), the archive smoke
#               split into its own smoke-matrix legs so the fleet runs once per leg
#   - verify  : programmatic project audit (make verify → scripts/maude-verify.sh)
#   - lint    : shellcheck the shell, gated at warning severity (make lint)
#
# History note: v3.0 / v4.0 of this file ran a `scrub` job against a private
# SCRUB_PATTERNS repo secret. That gate was specific to literals that no
# longer exist in this workflow, so the dead protection has been removed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only floor; the gitleaks job re-grants the one extra read it needs.
permissions:
  contents: read

jobs:
  test-matrix:
    strategy:
      fail-fast: false          # a macOS-only break must not mask the Linux result
      matrix:
        os: [ubuntu-latest, macos-latest]   # macOS = BSD userland + bash 3.2 (issue #39)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify jq present
        run: jq --version

      - name: Run hook test suite (make test)
        run: make test
        env:
          MAUDE_SMOKE_SEPARATE: "1"   # the smoke-matrix job runs the archive's fleet once

  # The prove-it-real gate on its own legs: a git-archive of HEAD must validate, pass its
  # own fleet, and greet. It re-runs the whole fleet inside the archive, so inside
  # test-matrix it doubled every leg (ubuntu 6 -> 10 min by v0.33.0); in parallel it costs
  # no wall time.
  smoke-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify jq present
        run: jq --version

      - name: Install smoke on the archive of HEAD (make smoke)
        run: make smoke

  # Summary gate: branch protection requires a check literally named "tests".
  # A matrix job publishes per-leg names ("test-matrix (macos-latest)"), so
  # this job restores the contracted name — green iff EVERY leg of both matrices is green.
  tests:
    needs: [test-matrix, smoke-matrix]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All test and smoke legs green
        run: test "${{ needs.test-matrix.result }}" = "success" && test "${{ needs.smoke-matrix.result }}" = "success"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # verify anchors each Revised: stamp on the file's last commit; a shallow clone refuses to measure

      - name: Verify jq present
        run: jq --version

      - name: Run project audit (make verify)
        run: make verify

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify shellcheck present
        run: shellcheck --version

      - name: Lint shell scripts (make lint)
        run: make lint

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks lists PR commits via the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # full history so gitleaks scans commits, not just the tree
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        # Free for individual accounts; GITHUB_TOKEN is needed to scan pull requests.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
