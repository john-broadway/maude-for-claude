name: OpenSSF Scorecard

# Supply-chain posture scoring, published to the public OpenSSF dashboard (the badge).
# It deliberately does NOT upload findings to the GitHub Security tab — those are posture
# *recommendations*, not vulnerabilities, and dumping them there just buries real alerts.
# Informational: it scores the repo's practices; it does not gate the build.
on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 2"   # weekly, Tuesday 05:23 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # publish results to the public Scorecard API (the badge)
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true   # -> OpenSSF dashboard/badge; NOT uploaded to the Security tab
