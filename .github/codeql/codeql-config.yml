name: "Maude CodeQL config"

# Scope CodeQL to the shipped Python: every maude_* package that ships in the
# public tree. tests/ is dev tooling and the shell surface is shellcheck's job
# in ci.yml; SAST analyzes exactly what ships, the same scoping discipline the
# test-py target uses. A new package is added here in the commit that adds it:
# tests/test-codeql-scope.sh fails when a shipped maude_* package is missing.
paths:
  - maude_eye
  - maude_marker
  - maude_recall
  - maude_rolodex
  - maude_rules
  - maude_shell
  - maude_tape
  - maude_vault
